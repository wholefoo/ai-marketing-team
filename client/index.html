          "name": "What is included in the free preview?",

          }
        },

          "@type": "Question",
          "name": "What additional content is in the full $99 report?",

            "@type": "Answer",
            "text": "The full report unlocks detailed analysis from each AI agent including strengths, weaknesses, and specific findings across all severity levels. You also get a complete 6-month action plan with prioritized tasks, timeline, and expected impact, plus a professional downloadable PDF report."
          }
        },
        {
          "@type": "Question",
          "name": "How long does an audit take?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Most audits complete in 1 to 3 minutes. The system scrapes your website, discovers linked pages, and runs all 5 AI agents in parallel."

        }
